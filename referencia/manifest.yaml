id: ibk-apolo-plugin
name: Plugin IBK Apolo
category: capacidad
scope: organización
status: borrador
owner: ai-delivery
maintainers:
  - ai-delivery
version: 0.1.0

summary: >
  Plugin organizacional para definición de producto: ciclo de vida de iniciativas (Especificación de Iniciativa, Paquete de Diseño de Solución, Plan de Entrega),
  diseño de historias de usuario, Mapeo de Ejemplos e integración con Jira/Xray.

audience:
  - analistas-de-negocio
  - dueños-de-producto
  - ingenieros-ste

technologies: []

capabilities:
  - ibk-apolo-handoff-validator
  - ibk-apolo-document-extraction
  - ibk-apolo-jira-cloud-api
  - ibk-apolo-figma-api
  - ibk-apolo-figma-design-builder
  - ibk-apolo-screen-yaml-skill
  - ibk-apolo-github-repo-context

risk_level: medio                 # escribe en Jira + contiene tokens de Jira/Figma/GitHub
requires_human_approval: true   # puertas destructivas: crear en Jira, generar en Figma, escrituras de archivo (§12)
uses_scripts: true              # habilidades en Python (jira/figma/github/extractor/screen-yaml)
uses_hooks: false
uses_mcp: false                 # 100% REST

compatible_with:
  core:
    - ibk-hefesto-plugin

lifecycle:
  created: 2026-07-22
  last_reviewed: 2026-07-25
  next_review: 2026-09-25
