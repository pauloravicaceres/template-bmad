version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bmad-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bmad_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: bmad-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/bmad_db?schema=public"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: bmad-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
