openapi: 3.0.3
info:
  title: Tech Work Hub - API de Sprints
  version: 1.0.0
  description: >
    Contrato HTTP de la HU-003. Todas las operaciones exigen Bearer JWT (Keycloak).
    La ventana de un Sprint es de 14 días calendario inclusivos (fin = inicio + 13).
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/sprints:
    post:
      summary: Crear un Sprint
      operationId: createSprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSprintRequest'
      responses:
        '201':
          description: Sprint creado (FR-001, FR-002)
          headers:
            Location:
              schema:
                type: string
                example: /api/sprints/3fa85f64-5717-4562-b3fc-2c963f66afa6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintResponse'
        '400':
          description: Datos inválidos o ventana distinta de 2 semanas (FR-003, FR-004, FR-005)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: Sin token, inválido o expirado (FR-010)
        '500':
          description: Fallo de persistencia, sin trazas internas (FR-011)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      summary: Listar Sprints
      operationId: listSprints
      responses:
        '200':
          description: Todos los Sprints registrados (FR-007)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SprintResponse'
        '401':
          description: Sin credenciales válidas (FR-010)
  /api/sprints/{id}:
    get:
      summary: Obtener un Sprint por identificador
      operationId: getSprintById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sprint encontrado (FR-008)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintResponse'
        '401':
          description: Sin credenciales válidas (FR-010)
        '404':
          description: Sprint inexistente (FR-009). Un id que no sea GUID tampoco coincide con la ruta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateSprintRequest:
      type: object
      properties:
        identification:
          type: string
          nullable: true
          maxLength: 100
          example: Sprint 2026-01
        startDate:
          type: string
          nullable: true
          description: Formato exacto yyyy-MM-dd
          example: '2026-10-05'
        endDate:
          type: string
          nullable: true
          description: Formato exacto yyyy-MM-dd; debe ser startDate + 13 días
          example: '2026-10-18'
    SprintResponse:
      type: object
      required: [id, identification, startDate, endDate]
      properties:
        id:
          type: string
          format: uuid
        identification:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              description: Mensajes de error por nombre de campo (camelCase)
              additionalProperties:
                type: array
                items:
                  type: string
