openapi: 3.0.3
info:
  title: Tech Work Hub - API de miembros del equipo y roles técnicos
  version: 1.0.0
  description: >
    Contrato HTTP de la HU-012. Todas las operaciones exigen Bearer JWT (Keycloak).
    Orden de evaluación del POST: 400 (validador), 401 (identidad), 400 (rol no válido).
    No se impone cardinalidad miembro-rol, unicidad del miembro ni ciclo de vida (FR-015).
    Las respuestas no incluyen CreatedAt ni CreatedBy.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/team-members:
    post:
      summary: Registrar un miembro del equipo con un rol técnico
      operationId: registerTeamMember
      description: >
        Un miembro y un rol por solicitud. role es el NOMBRE de un rol del catálogo
        (comparación sensible a mayúsculas). name se guarda recortado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTeamMemberRequest'
            examples:
              desarrollo:
                value: { name: Ana Torres, role: Desarrollo }
              qa:
                value: { name: Luis Rojas, role: QA }
      responses:
        '201':
          description: Miembro registrado (FR-001, FR-002, FR-003). El código 201 es PROPUESTO.
          headers:
            Location:
              schema:
                type: string
                example: /api/team-members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberResponse'
        '400':
          description: >
            Nombre o rol ausente, vacío o de solo espacios (errores por campo bajo name y role, FR-007),
            o rol que no existe en el catálogo (detail con "El rol indicado no es válido.", FR-006).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: Sin token, inválido o expirado (FR-011)
        '500':
          description: Fallo de persistencia, sin trazas internas ni miembro parcial (FR-013)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      summary: Consultar los miembros registrados
      operationId: listTeamMembers
      description: >
        Devuelve exactamente los miembros registrados, sin modificar datos. Orden PROPUESTO
        (no contractual): CreatedAt y luego Id. Sin paginación ni filtros (punto abierto 7).
      responses:
        '200':
          description: Arreglo de miembros; vacío si no hay ninguno (FR-008, FR-009)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMemberResponse'
        '401':
          description: Sin token, inválido o expirado (FR-011)
        '500':
          description: Fallo de lectura, sin trazas internas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/technical-roles:
    get:
      summary: Consultar el catálogo de roles técnicos
      operationId: listTechnicalRoles
      description: >
        Contiene como mínimo "Desarrollo" y "QA" (FR-004, FR-005). Orden PROPUESTO (no contractual): Name.
        El catálogo es de solo lectura: no existe alta ni edición de roles.
      responses:
        '200':
          description: Arreglo de roles con identificador y nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnicalRoleResponse'
        '401':
          description: Sin token, inválido o expirado (FR-011)
        '500':
          description: Fallo de lectura, sin trazas internas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterTeamMemberRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Obligatorio, no vacío ni de solo espacios. Sin límite de longitud definido (ADR-007).
        role:
          type: string
          nullable: true
          description: Nombre de un rol del catálogo. Obligatorio, no vacío ni de solo espacios.
    TeamMemberResponse:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          description: Nombre del rol técnico
    TechnicalRoleResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              description: Mensajes por campo (name, role)
              additionalProperties:
                type: array
                items:
                  type: string
