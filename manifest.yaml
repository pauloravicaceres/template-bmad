id: bmad-ecosystem-plugin
name: Plugin BMAD Multi-Agente
category: capacidad
scope: organización
status: activo
owner: ai-delivery
maintainers:
  - ai-delivery
version: 1.1.0

summary: >
  Plugin organizacional para la definición integral, autónoma y desacoplada de software bajo metodología BMAD:
  descubrimiento de ideas (Business Storyteller), redacción de Product Briefs (Product Analyst),
  gestión de alcance y backlog de MVP (Product Manager), especificación BDD/Gherkin (Business Analyst),
  auditoría documental rigurosa (QA Documental), diseño de wireframes interactivos (Designer UX),
  gobernanza de stack y cloud (Solutions Architect), modelado relacional MER (Data Architect),
  diseño de contratos de integración (API Architect) y compilación del TDD con diagramación dual (QA Tech).
  Soporta de manera nativa proyectos Greenfield y Brownfield, además de un motor dinámico de inyección de habilidades (skills).

audience:
  - analistas-de-negocio
  - dueños-de-producto
  - gerentes-de-producto
  - arquitectos-de-software
  - arquitectos-de-soluciones
  - arquitectos-de-datos
  - diseñadores-ux
  - ingenieros-de-calidad
  - desarrolladores-de-software

technologies:
  - python
  - herdr
  - agy
  - mcp-filesystem
  - mcp-stitch
  - git

capabilities:
  - bmad-business-storyteller
  - bmad-product-analyst
  - bmad-product-manager
  - bmad-business-analyst
  - bmad-qa-documental
  - bmad-designer-ux
  - bmad-solutions-architect
  - bmad-data-architect
  - bmad-api-architect
  - bmad-qa-tech
  - bmad-dual-greenfield-brownfield
  - bmad-watcher-orchestrator
  - bmad-mcp-filesystem-tools
  - bmad-mcp-stitch-tools
  - bmad-dynamic-skill-injection
  - skill-tracker-logger
  - skill-export-pdf
  - skill-git-commit
  - skill-read-pdf
  - skill-pb-validator
  - skill-hu-validator

risk_level: medio
requires_human_approval: true   # Discovery interactivo HITL en BS + Pausa obligatoria post-PB (approve_step.py) + Q&A SA en Greenfield + Aprobación TDD (@DEV:)
uses_scripts: true              # watcher_bmad.py, utils/start_agents.py, utils/clean_files.py, utils/delete_agents.py, utils/approve_step.py
uses_hooks: false
uses_mcp: true                  # MCP Filesystem (read_file / write_file) y MCP Stitch (UI wireframes)

compatible_with:
  runtime:
    - herdr-cli
    - agy-agent-framework

