id: bmad-ecosystem-plugin
name: Plugin BMAD Multi-Agente
category: capacidad
scope: organización
status: activo
owner: ai-delivery
maintainers:
  - ai-delivery
version: 1.0.0

summary: >
  Plugin organizacional para la definición integral y autónoma de software bajo metodología BMAD:
  descubrimiento de ideas (Business Storyteller), redacción de Product Briefs (Product Analyst),
  gestión de alcance y backlog de MVP (Product Manager), especificación BDD/Gherkin (Business Analyst),
  auditoría documental rigurosa (QA Documental) y diseño de wireframes interactivos (Designer UX).

audience:
  - analistas-de-negocio
  - dueños-de-producto
  - gerentes-de-producto
  - arquitectos-de-software
  - diseñadores-ux
  - ingenieros-de-calidad

technologies:
  - python
  - herdr
  - agy
  - mcp-filesystem
  - mcp-stitch
  - git

capabilities:
  - bmad-business-storyteller
  - bmad-product-analyst
  - bmad-product-manager
  - bmad-business-analyst
  - bmad-qa-documental
  - bmad-designer-ux
  - bmad-watcher-orchestrator
  - bmad-mcp-filesystem-tools
  - bmad-mcp-stitch-tools

risk_level: medio
requires_human_approval: true   # Discovery interactivo HITL en BS + control de bucles de QA
uses_scripts: true              # watcher_bmad.py, utils/start_agents.py, utils/clean_files.py, utils/delete_agents.py
uses_hooks: false
uses_mcp: true                  # MCP Filesystem (read_file / write_file) y MCP Stitch (UI wireframes)

compatible_with:
  runtime:
    - herdr-cli
    - agy-agent-framework

lifecycle:
  created: 2026-08-15
  last_reviewed: 2026-09-16
  next_review: 2026-12-16
